<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Nightmare Depths</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#cdb9a4;overflow:hidden;font-family:Georgia,"Times New Roman",serif;touch-action:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
.hidden{display:none!important}
svg.ic{width:1.2em;height:1.2em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;z-index:5;touch-action:none}
#stickBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(150,30,30,.55);background:radial-gradient(circle,rgba(60,10,10,.25),rgba(0,0,0,.15));display:none;pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(210,80,60,.65),rgba(90,10,10,.7));border:1px solid rgba(255,120,90,.5)}
.tbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(170,35,35,.6);background:radial-gradient(circle at 40% 35%,rgba(90,15,15,.55),rgba(14,2,2,.5));color:#e9b9a0;font-size:15px;touch-action:none;pointer-events:auto}
.tbtn svg{width:46%;height:46%}
.tbtn.on,.tbtn:active{background:radial-gradient(circle at 40% 35%,rgba(210,60,40,.75),rgba(70,8,8,.7));color:#fff}
.tbtn small{position:absolute;bottom:3px;right:6px;font-size:12px;color:#ffd7a0;text-shadow:0 0 4px #000}
#btnFireL{width:max(64px,13vmin);height:max(64px,13vmin);left:calc(4vw + env(safe-area-inset-left));top:38vh}
#btnFireR{width:max(84px,19vmin);height:max(84px,19vmin);right:calc(4vw + env(safe-area-inset-right));bottom:9vh}
#btnFak{width:max(56px,11.5vmin);height:max(56px,11.5vmin);right:calc(4vw + env(safe-area-inset-right));bottom:calc(9vh + max(84px,19vmin) + 14px)}
#btnSwap{width:max(50px,10vmin);height:max(50px,10vmin);right:calc(4vw + max(84px,19vmin) + 16px + env(safe-area-inset-right));bottom:9vh}
#btnReload{width:max(44px,8.5vmin);height:max(44px,8.5vmin);right:calc(4vw + max(84px,19vmin) + 16px + env(safe-area-inset-right));bottom:calc(9vh + max(50px,10vmin) + 10px)}
#btnPause{width:42px;height:42px;left:calc(8px + env(safe-area-inset-left));top:8px}

/* ---------- screens ---------- */
#rotate{display:none;position:fixed;inset:0;z-index:200;background:#000;color:#c9a35a;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;font-size:20px;letter-spacing:.06em}
#rotate small{font-size:13px;color:#8a6a5a}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.84);overflow-y:auto;touch-action:pan-y;padding:10px}
#screen *{touch-action:pan-y}
#screen.clear{background:rgba(0,0,0,.35)}
.panel{width:min(94vw,640px);max-height:94vh;overflow-y:auto;padding:18px 22px;background:linear-gradient(rgba(24,6,6,.94),rgba(6,1,1,.96));border:1px solid #521010;box-shadow:0 0 50px rgba(120,0,0,.35) inset,0 0 40px #000;border-radius:4px;margin:auto}
.panel.wide{width:min(96vw,860px)}
h1.title{margin:0 0 4px;font-size:clamp(30px,8vmin,64px);letter-spacing:.14em;text-align:center;font-weight:700;color:#c52a1a;text-shadow:0 0 18px #7a0000,0 0 4px #000;animation:flick 5s infinite}
h1.title span{display:block;font-size:.34em;letter-spacing:.5em;color:#7d6a58;text-shadow:none;animation:none}
h2{margin:0 0 10px;font-size:clamp(20px,4.6vmin,30px);letter-spacing:.12em;text-transform:uppercase;color:#c8412c;text-shadow:0 0 10px #5a0000;text-align:center}
h3{margin:14px 0 6px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#a07860}
p{margin:6px 0;line-height:1.45;font-size:15px}
.dim{color:#7f6c5c;font-size:13px}
.center{text-align:center}
@keyframes flick{0%,91%,94%,100%{opacity:1}92%{opacity:.35}93%{opacity:.9}95%{opacity:.5}96%{opacity:1}}
.btn{display:flex;align-items:center;justify-content:center;gap:.6em;width:100%;padding:13px 14px;margin:8px 0;background:linear-gradient(#2c0b0b,#120404);border:1px solid #6e1818;color:#ecd2b4;font:inherit;font-size:15px;letter-spacing:.16em;text-transform:uppercase;border-radius:3px;cursor:pointer}
.btn:active,.btn:hover{background:linear-gradient(#4a1010,#200707);color:#fff}
.btn.small{display:inline-flex;width:auto;padding:8px 14px;margin:4px 3px;font-size:12px}
.btn.dis{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.tabs{display:flex;gap:4px;margin:8px 0}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid #3d1010;background:#0d0303;color:#8c7664;cursor:pointer}
.tab.on{background:#3a0c0c;color:#f0d2b0;border-color:#8a2020}
.item{display:flex;align-items:center;gap:12px;padding:10px;margin:7px 0;border:1px solid #321010;background:rgba(30,8,8,.55);border-radius:3px}
.item .ico{flex:0 0 38px;height:38px;display:flex;align-items:center;justify-content:center;color:#d6693f;font-size:26px}
.item .txt{flex:1;min-width:0}
.item .nm{font-size:15px;letter-spacing:.06em;color:#f0d9bd}
.item .ds{font-size:12px;color:#8d7867;margin-top:2px}
.item .buy{flex:0 0 auto;min-width:92px;padding:9px 8px;text-align:center;border:1px solid #7b1c1c;background:#2b0909;color:#ffd9aa;font:inherit;font-size:13px;letter-spacing:.06em;border-radius:3px;cursor:pointer}
.item .buy.no{opacity:.4;border-color:#442;color:#998}
.item .buy.max{border-color:#2a4a2a;color:#9c9;background:#0b1a0b}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.pips i{width:7px;height:7px;background:#2a1010;border:1px solid #5a1a1a;display:inline-block}
.pips i.f{background:#c9452d;border-color:#ff8060}
.credits{text-align:center;font-size:20px;color:#f2c264;letter-spacing:.1em;margin:4px 0 8px;text-shadow:0 0 8px #6a4000}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 5px;text-align:right;border-bottom:1px solid #2a0f0f}
th{color:#a07860;font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
th:first-child,td:first-child{text-align:left}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a0f0f;font-size:15px}
.stat b{color:#f2c264;font-weight:400}
.big{font-size:clamp(26px,6vmin,44px);text-align:center;letter-spacing:.14em;color:#d63a22;text-shadow:0 0 16px #700;margin:6px 0}
label.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #2a0f0f;font-size:15px}
label.set input[type=range]{flex:0 0 52%}
label.set select{background:#1a0606;color:#ecd2b4;border:1px solid #6e1818;padding:6px;font:inherit}
input[type=range]{accent-color:#c23a22}
input[type=checkbox]{width:22px;height:22px;accent-color:#c23a22}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:10;padding:8px 18px;background:rgba(10,0,0,.7);border:1px solid #5a1212;color:#f0cfa6;letter-spacing:.1em;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8a2a1a;letter-spacing:.4em;font-size:15px;text-transform:uppercase}
#loading .bar{width:180px;height:3px;background:#200;margin-top:14px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:#c33;animation:ld 1.1s infinite linear}
@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;color:#e3c9ae;text-shadow:0 0 4px #000,0 0 2px #000}
#hud .tl{position:absolute;left:calc(58px + env(safe-area-inset-left));top:10px;display:flex;gap:10px;align-items:center;font-size:15px}
#hud .tl .ky{display:flex;gap:6px}
#hud .tl .ky svg{width:22px;height:22px}
#hud .tl .lt{color:#e8c070}
#mini{position:absolute;right:calc(8px + env(safe-area-inset-right));top:8px;width:128px;height:128px;border:1px solid rgba(140,40,30,.7);background:rgba(0,0,0,.55);pointer-events:auto;touch-action:none;opacity:.92}
#hud .ammo{position:absolute;right:calc(10px + env(safe-area-inset-right));top:142px;text-align:right;font-size:13px;letter-spacing:.08em}
#hud .ammo b{font-size:26px;font-weight:400;color:#f3d9b0;display:block;line-height:1}
#hud .ammo span{color:#a78c76;font-size:12px}
#hud .hp{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:12px;width:min(34vw,220px)}
#hud .hp .bar{height:12px;border:1px solid #6d1a1a;background:rgba(10,0,0,.7);position:relative}
#hud .hp .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#d83a2a,#7a0e0e);width:100%}
#hud .hp .txt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;letter-spacing:.08em}
#hud .obj{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#b89a80;text-align:center;opacity:.9;max-width:34vw}
#hud .cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,230,200,.55);box-shadow:0 0 4px #000}
#hud .hint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;color:#9b8470;text-align:center;transition:opacity 1s}
#hud .hint.off{opacity:0}
#hud .lname{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(20px,5vmin,38px);letter-spacing:.3em;color:#c0391f;text-transform:uppercase;text-shadow:0 0 20px #600;opacity:0;transition:opacity 1.2s}
#hud .lname.on{opacity:1}
#hud .lname small{display:block;font-size:.4em;letter-spacing:.4em;color:#8c7766;margin-top:8px}
@media (max-height:430px){.panel{padding:10px 16px}.btn{padding:9px;margin:5px 0}h1.title{font-size:34px}.item{padding:6px;margin:5px 0}}
</style>
</head>
<body>
<svg id="icons" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<canvas id="view"></canvas>
<div id="hud" class="hidden">
  <div class="tl"><span class="ky" id="hKeys"></span><span class="lt" id="hLoot"></span></div>
  <canvas id="mini" width="256" height="256"></canvas>
  <div class="ammo"><b id="hAmmo">0</b><span id="hWep"></span></div>
  <div class="hp"><div class="txt"><span id="hHp">100</span><span id="hFak"></span></div><div class="bar"><i id="hBar"></i></div></div>
  <div class="obj" id="hObj"></div>
  <div class="cross"></div>
  <div class="hint" id="hHint"></div>
  <div class="lname" id="hLname"></div>
</div>
<div id="touch" class="hidden">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="btnFireL" class="tbtn" data-b="fire"><svg class="ic"><use href="#i-bolt"/></svg></div>
  <div id="btnFireR" class="tbtn" data-b="fire"><svg class="ic"><use href="#i-bolt"/></svg></div>
  <div id="btnFak" class="tbtn" data-b="fak"><svg class="ic"><use href="#i-medkit"/></svg><small id="fakN">1</small></div>
  <div id="btnSwap" class="tbtn" data-b="swap"><svg class="ic"><use href="#i-swap"/></svg></div>
  <div id="btnReload" class="tbtn" data-b="reload"><svg class="ic"><use href="#i-bullet"/></svg></div>
  <div id="btnPause" class="tbtn" data-b="pause"><svg class="ic"><use href="#i-pause"/></svg></div>
</div>
<div id="toast"></div>
<div id="screen" class="hidden"></div>
<div id="rotate"><svg viewBox="0 0 64 64" width="84" height="84" fill="none" stroke="#c9a35a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="40" rx="4"/><path d="M32 41h0"/><path d="M10 50a24 24 0 0 0 40 8"/><path d="M52 52l-2 7-7-2"/></svg><div>Rotate your device<br><small>Nightmare Depths plays in landscape</small></div></div>
<div id="loading"><div>Summoning</div><div class="bar"><i></i></div></div>
<script>
'use strict';
/* ===================== NIGHTMARE DEPTHS ===================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = mulberry((Date.now() ^ 0x5bd1e995) >>> 0);
const rnd = (a, b) => (b === undefined ? R() * a : a + R() * (b - a));
const irnd = (a, b) => Math.floor(a + R() * (b - a + 1));
const pick = (a) => a[Math.floor(R() * a.length)];
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const fmtT = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* ---------------- inline SVG icon sprite (no network, no packs) ---------------- */
const ICONS = {
  infinity: '<path d="M12 12c-2-3-3.5-4-5.5-4a4 4 0 0 0 0 8c2 0 3.5-1 5.5-4zm0 0c2 3 3.5 4 5.5 4a4 4 0 0 0 0-8c-2 0-3.5 1-5.5 4z"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  medkit: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M12 10v7M8.5 13.5h7M9 7V5h6v2"/>',
  swap: '<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  bullet: '<path d="M9 21V10c0-3 1.5-5 3-7 1.5 2 3 4 3 7v11z"/><path d="M9 17h6"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  map: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  key: '<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M21 12v3"/>',
  skull: '<path d="M12 3C7 3 4 6.5 4 11c0 3 1.5 4.5 3 5.5V20h10v-3.5c1.5-1 3-2.5 3-5.5 0-4.5-3-8-8-8z"/><circle cx="9" cy="11" r="1.6"/><circle cx="15" cy="11" r="1.6"/><path d="M10 16v3M14 16v3"/>',
  flame: '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',
  flash: '<path d="M7 3h10l-2 5v13H9V8z"/><path d="M5 1l2 2M19 1l-2 2M12 1v2"/>',
  glow: '<rect x="9" y="3" width="6" height="18" rx="3"/><path d="M4 8L2 6M20 8l2-2M4 16l-2 2M20 16l2 2"/>',
  shield: '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',
  heart: '<path d="M12 21C5 15 3 11 3 8a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c0 3-2 7-9 13z"/>',
  speed: '<path d="M3 17l6-6 4 4 8-9M15 6h6v6"/>',
  aim: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>',
  gun: '<path d="M3 8h15l3 2v3h-8v2l-1.5 4H8.5L10 14H3z"/>',
  rifle: '<path d="M1 11h13l2-2h5v3h-5l-2 2H8l-1 4H4l1-4H1z"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M12 6v12M9 9.5c0-1 1.2-1.5 3-1.5s3 .5 3 1.5-1.200 1.500-3 2-3 1-3 2 1.200 1.500 3 1.500 3-.5 3-1.500"/>',
  gem: '<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 6 3-6M12 21L9 9M12 21l3-12"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  shop: '<path d="M4 7h16l-1 13H5zM8 7V5a4 4 0 0 1 8 0v2"/>',
  trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H3c0 4 2 5 4 5M17 6h4c0 4-2 5-4 5M12 14v4M8 21h8M10 18h4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  close: '<path d="M5 5l14 14M19 5L5 19"/>',
  retry: '<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>',
  home: '<path d="M3 11l9-8 9 8M5 9v11h14V9M10 20v-6h4v6"/>',
  eye: '<path d="M2 12c3-5 7-7 10-7s7 2 10 7c-3 5-7 7-10 7s-7-2-10-7z"/><circle cx="12" cy="12" r="3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  ammo: '<rect x="3" y="8" width="18" height="12" rx="1"/><path d="M3 12h18M10 8V5h4v3"/>',
  vol: '<path d="M3 9v6h4l5 4V5L7 9zM16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14"/>',
  laser: '<path d="M3 12h14M17 8l4 4-4 4"/>',
  book: '<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6M20 4v14h-6"/>',
  skip: '<path d="M5 5l9 7-9 7zM17 5v14"/>',
};
function buildIcons() {
  $('icons').innerHTML = Object.keys(ICONS).map((k) => `<symbol id="i-${k}" viewBox="0 0 24 24">${ICONS[k]}</symbol>`).join('');
}
const ic = (n, st) => `<svg class="ic"${st ? ` style="${st}"` : ''}><use href="#i-${n}"/></svg>`;

/* ---------------- data tables ---------------- */
const THEMES = [
  { name: 'The Forgotten Temple', short: 'TEMPLE', amb: [10, 7, 4], step: 'stone' },
  { name: 'The Drowned Caverns', short: 'CAVE', amb: [4, 7, 10], step: 'wet' },
  { name: 'Station Omega', short: 'FACILITY', amb: [4, 8, 9], step: 'metal' },
  { name: 'The Burning Dark', short: 'HELL', amb: [13, 3, 3], step: 'flesh' },
];
const themeOf = (L) => Math.floor((L - 1) / 10) % 4;

// primary slot + sidearm slot, upgrade replaces
const WP = [
  { id: 'rifle', name: 'Hunting Rifle', dmg: 72, pel: 1, spr: 0.004, rof: 0.62, rel: 1.3, mag: 1, cap: 30, auto: 0, cost: 0, pk: 6, tier: 1 },
  { id: 'shotgun', name: 'Pump Shotgun', dmg: 15, pel: 9, spr: 0.075, rof: 0.85, rel: 2.1, mag: 6, cap: 48, auto: 0, cost: 700, pk: 8, tier: 2 },
  { id: 'ar', name: 'Assault Rifle', dmg: 27, pel: 1, spr: 0.014, rof: 0.105, rel: 2.0, mag: 30, cap: 240, auto: 1, cost: 2200, pk: 30, tier: 3 },
  { id: 'minigun', name: 'Minigun', dmg: 19, pel: 1, spr: 0.045, rof: 0.05, rel: 3.6, mag: 200, cap: 800, auto: 1, cost: 5000, pk: 80, tier: 4, spin: 0.7 },
  { id: 'pulse', name: 'Pulse Laser Rifle', dmg: 50, pel: 1, spr: 0.006, rof: 0.14, rel: 0, mag: 0, cap: 0, auto: 1, cost: 10000, inf: 1, pierce: 2, tier: 5 },
];

function loadSave() {
  try {
    const j = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');

const AU = { c: null, mg: null, rv: null, rg: null, noise: null, ready: false, amb: null, evT: 3, hbT: 0 };
function auInit() {
  if (AU.c) { if (AU.c.state === 'suspended') AU.c.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const c = (AU.c = new C());
    AU.mg = c.createGain(); AU.mg.gain.value = SV.set.vol;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
    AU.mg.connect(comp); comp.connect(c.destination);
    const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    AU.noise = nb;
    const len = Math.floor(c.sampleRate * 2.8);
    const ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6) * (i < 1500 ? i / 1500 : 1);
    }

    AU.rg = c.createGain(); AU.rg.gain.value = 0.5;

function aTone(o) {
  if (!AU.ready) return;
  const c = AU.c, t = c.currentTime + (o.at || 0);

/* ---------- main update ---------- */

  G.time += dt;
  P.fireT = Math.max(0, P.fireT - dt); P.swapT = Math.max(0, P.swapT - dt); P.muzzle = Math.max(0, P.muzzle - dt); P.kick = Math.max(0, P.kick - dt * 6); P.fakT = Math.max(0, P.fakT - dt); P.beam = Math.max(0, P.beam - dt); P.hurtSnd = Math.max(0, P.hurtSnd - dt); P.lockMsgT = Math.max(0, P.lockMsgT - dt); P.gateMsgT = Math.max(0, P.gateMsgT - dt);

  const lowHp = P.hp / P.maxhp < 0.35; G.hbT -= dt;

scr.addEventListener('input', (e) => {

  let v = e.target.type === 'checkbox' ? (e.target.checked ? 1 : 0) : parseFloat(e.target.value); SV.set[k] = v; saveGame();
  if (k === 'vol') aSetVol(); if (k === 'q') { autoW = 320; setRes(); } if (k === 'touch') applyTouchMode();
});

/* ---------------- flow ---------------- */
function lockPtr() { try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function enterFS(force) {
  if (!force && !SV.set.fs) return;
  const d = document.documentElement, isFS = document.fullscreenElement || document.webkitFullscreenElement;
  const lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch (e) {} };
  if (isFS) { lock(); return; }
  try { const fn = d.requestFullscreen || d.webkitRequestFullscreen; if (fn) { const p = fn.call(d, { navigationUI: 'hide' }); if (p && p.then) p.then(lock, () => {}); else lock(); } } catch (e) {}
}
function playLevel(L, mode, realm) {
  G.mode = mode || 'campaign'; G.realm = realm || 0; enterFS();
  hideScreen(); auInit(); aSetVol(); startLevel(L); applyTouchMode();
  $('hud').classList.remove('hidden'); if (IN.touch) $('touch').classList.remove('hidden');
  const ln = $('hLname'); ln.innerHTML = `${G.mode === 'endless' ? 'ENDLESS &middot; DEPTH ' + (L - G.realm * 10) : 'LEVEL ' + L}<small>${THEMES[G.lv.theme].name}</small>`; ln.classList.add('on'); setTimeout(() => ln.classList.remove('on'), 3800);
  const hint = $('hHint'); hint.classList.remove('off'); hint.textContent = IN.touch ? 'Left thumb: move  |  Right thumb: look  |  Tap the minimap for the map' : 'WASD move | Mouse look | Click fire | R reload | Q swap | F medkit | M map';
  setTimeout(() => hint.classList.add('off'), 9000);
  if (!IN.touch) lockPtr();
  lastHud = 0;
}
function pauseGame() { if (G.state !== 'play') return; G.state = 'paused'; IN.fire = false; releaseAllTouch(); try { document.exitPointerLock(); } catch (e) {} showPause(); try { if (AU.c) AU.c.suspend(); } catch (e) {} }
function resumeGame() { try { if (AU.c) AU.c.resume(); } catch (e) {} if (G.state === 'paused' || G.state === 'map') { G.state = 'play'; hideScreen(); if (!IN.touch) lockPtr(); } }
function toMenu() { ambStop(); try { if (AU.c) AU.c.resume(); } catch (e) {} buildMenuScene(); showTitle(); }
function buildMenuScene() { G.mode = 'campaign'; G.realm = 0; startLevel(1, true); G.state = 'menu'; G.ents = []; G.proj = []; G.items = []; P.a = Math.random() * TAU; }
function applyTouchMode() { const m = SV.set.touch; IN.touch = m === 1 || (m === 2 && ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0)); if (!IN.touch) $('touch').classList.add('hidden'); else if (G.state === 'play') $('touch').classList.remove('hidden'); }

/* ---------------- HUD ---------------- */
let lastHud = 0, lastMini = 0;
const hudCache = {};
function setH(id, html) { if (hudCache[id] !== html) { hudCache[id] = html; $(id).innerHTML = html; } }
function updHud(now) {
  if (now - lastHud < 110) return; lastHud = now;
  const w = curW(), keyHtml = (c, on, name) => `<span title="${name}" style="color:${on ? c : '#3a2a2a'}">${ic('key')}</span>`;
  const hasLocks = G.lv.locks.length;
  setH('hKeys', keyHtml('#ffd84a', P.keys.M, 'Exit Key') + (hasLocks > 0 ? keyHtml('#e0903a', P.keys.A, 'Bronze Key') : '') + (hasLocks > 1 ? keyHtml('#3ae0a0', P.keys.B, 'Jade Key') : ''));
  const lt = G.lv.items.filter((i) => i.t === 'loot').length; setH('hLoot', `${ic('gem')} ${G.lootN}/${lt}`);
  setH('hAmmo', w.inf ? '&infin;' : `${P.mag[P.cur]}<span style="font-size:15px;color:#a78c76"> / ${reserveOf(P.cur)}</span>`);
  $('hWep').textContent = w.name + (P.reload > 0 ? ' (reloading)' : '');
  $('hHp').textContent = Math.ceil(P.hp) + ' / ' + P.maxhp; $('hBar').style.width = clamp((P.hp / P.maxhp) * 100, 0, 100) + '%';
  setH('hFak', `${ic('medkit')} ${P.fak}`); $('fakN').textContent = P.fak;
  const need = []; if (!P.keys.M) need.push('Find the exit key'); else need.push('Reach the gate');
  $('hObj').textContent = need[0];
}

/* ---------------- keyboard / mouse ---------------- */
const KEY = {};
function recalcKeys() { IN.fw = (KEY.KeyW || KEY.ArrowUp ? 1 : 0) - (KEY.KeyS || KEY.ArrowDown ? 1 : 0); IN.st = (KEY.KeyD ? 1 : 0) - (KEY.KeyA ? 1 : 0); IN.turnK = (KEY.ArrowRight ? 1 : 0) - (KEY.ArrowLeft ? 1 : 0); }
window.addEventListener('keydown', (e) => {
  if (e.repeat && e.code !== 'KeyW') { if (['Tab', 'Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); return; }
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  KEY[e.code] = true; recalcKeys();
  if (G.state === 'play') {
    if (e.code === 'Space' || e.code === 'ControlLeft' || e.code === 'KeyJ') { IN.fire = true; IN.fireEdge = true; }
    else if (e.code === 'KeyR') startReload(); else if (e.code === 'KeyQ' || e.code === 'Tab') swapWeapon();
    else if (e.code === 'Digit1' && P.cur !== 0) swapWeapon(); else if (e.code === 'Digit2' && P.cur !== 1) swapWeapon();
    else if (e.code === 'KeyF' || e.code === 'KeyH' || e.code === 'KeyE') useFak();
    else if (e.code === 'KeyM') { G.state = 'map'; IN.fire = false; try { document.exitPointerLock(); } catch (er) {} showMap(); }
    else if (e.code === 'Escape' || e.code === 'KeyP') pauseGame();
  } else if (G.state === 'map' && (e.code === 'KeyM' || e.code === 'Escape')) resumeGame();
  else if (G.state === 'paused' && (e.code === 'Escape' || e.code === 'KeyP')) resumeGame();
});
window.addEventListener('keyup', (e) => { KEY[e.code] = false; recalcKeys(); if (e.code === 'Space' || e.code === 'ControlLeft' || e.code === 'KeyJ') IN.fire = false; });
cv.addEventListener('mousedown', (e) => {
  if (G.state !== 'play' || IN.touch && e.pointerType === 'touch') return;
  if (document.pointerLockElement !== cv) { try { cv.requestPointerLock(); } catch (er) {} return; }
  if (e.button === 0) { IN.fire = true; IN.fireEdge = true; }
});
window.addEventListener('mouseup', (e) => { if (e.button === 0 && !touchFire) IN.fire = false; });
window.addEventListener('mousemove', (e) => { if (document.pointerLockElement === cv && G.state === 'play') { IN.dyaw += e.movementX * 0.0022 * SV.set.sens; IN.dpitch += -e.movementY * 0.0016 * SV.set.sens; } });
window.addEventListener('wheel', (e) => { if (G.state === 'play') swapWeapon(); }, { passive: true });
document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement !== cv && G.state === 'play' && !IN.touch) pauseGame(); });
try { matchMedia('(orientation:portrait) and (pointer:coarse)').addEventListener('change', (e) => { if (e.matches && G.state === 'play') pauseGame(); }); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pauseGame(); });
window.addEventListener('blur', () => { if (G.state === 'play') pauseGame(); });
window.addEventListener('contextmenu', (e) => e.preventDefault());
$('mini').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (G.state === 'play') { IN.fire = false; releaseAllTouch(); G.state = 'map'; try { document.exitPointerLock(); } catch (er) {} showMap(); } });

/* ---------------- touch ---------------- */
const tEl = $('touch'), stick = { id: null, sx: 0, sy: 0 }, look = { id: null, lx: 0, ly: 0 }, tBtn = {};
let touchFire = 0;
function releaseAllTouch() { stick.id = null; look.id = null; IN.fw = 0; IN.st = 0; $('stickBase').style.display = 'none'; for (const k in tBtn) { tBtn[k].el.classList.remove('on'); delete tBtn[k]; } touchFire = 0; IN.fire = false; }
function pressBtn(b, el, id) {
  tBtn[id] = { b, el }; el.classList.add('on');
  if (b === 'fire') { touchFire++; IN.fire = true; IN.fireEdge = true; } else if (b === 'fak') useFak(); else if (b === 'swap') swapWeapon(); else if (b === 'reload') startReload(); else if (b === 'pause') pauseGame();
}
function relBtn(id) { const t = tBtn[id]; if (!t) return; t.el.classList.remove('on'); if (t.b === 'fire') { touchFire = Math.max(0, touchFire - 1); if (!touchFire) IN.fire = false; } delete tBtn[id]; }
tEl.addEventListener('pointerdown', (e) => {
  e.preventDefault(); if (G.state !== 'play') return;
  if (e.pointerType === 'mouse') { IN.touch = false; SV.set.touch = 2; tEl.classList.add('hidden'); try { cv.requestPointerLock(); } catch (er) {} return; }
  IN.touch = true; try { tEl.setPointerCapture(e.pointerId); } catch (er) {}
  const b = e.target.closest('[data-b]'); if (b) { pressBtn(b.dataset.b, b, e.pointerId); return; }
  if (e.clientX < window.innerWidth * 0.46) { if (stick.id === null) { stick.id = e.pointerId; stick.sx = e.clientX; stick.sy = e.clientY; const sb = $('stickBase'); sb.style.display = 'block'; sb.style.left = e.clientX + 'px'; sb.style.top = e.clientY + 'px'; $('stickKnob').style.transform = 'translate(0,0)'; } }
  else if (look.id === null) { look.id = e.pointerId; look.lx = e.clientX; look.ly = e.clientY; }
});
tEl.addEventListener('pointermove', (e) => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.sx, dy = e.clientY - stick.sy; const m = Math.hypot(dx, dy), R = 58; if (m > R) { dx = (dx / m) * R; dy = (dy / m) * R; }
    $('stickKnob').style.transform = `translate(${dx}px,${dy}px)`;
    const nx = dx / R, ny = dy / R, dz = 0.14, f = (v) => (Math.abs(v) < dz ? 0 : (v - Math.sign(v) * dz) / (1 - dz));
    IN.st = clamp(f(nx), -1, 1); IN.fw = clamp(-f(ny), -1, 1);
  } else if (e.pointerId === look.id) {
    const dx = e.clientX - look.lx, dy = e.clientY - look.ly; look.lx = e.clientX; look.ly = e.clientY;
    IN.dyaw += dx * 0.0052 * SV.set.sens; IN.dpitch += -dy * 0.0032 * SV.set.sens;
  }
});
const tUp = (e) => { if (e.pointerId === stick.id) { stick.id = null; IN.fw = 0; IN.st = 0; $('stickBase').style.display = 'none'; } if (e.pointerId === look.id) look.id = null; relBtn(e.pointerId); };
tEl.addEventListener('pointerup', tUp); tEl.addEventListener('pointercancel', tUp); tEl.addEventListener('lostpointercapture', tUp);

/* ---------------- main loop ---------------- */
let lastT = 0, frameAcc = 0, frameN = 0, menuEye = 3;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016); lastT = ts;
  if (G.state === 'play') { if (IN.turnK) IN.dyaw += IN.turnK * dt * 2.3; updateGame(dt); }
  else if (G.state === 'dead') updateGame(dt);
  else if (G.state === 'menu') { G.time += dt; P.a += dt * 0.12; updFx(dt); menuEye -= dt; if (menuEye <= 0) { menuEye = rnd(3, 6); spawnEyes(); } }
  else if (G.state === 'done' || G.state === 'paused' || G.state === 'map') updFx(0);
  if (G.lv) drawView();
  if (G.state === 'play') {
    updHud(ts);
    if (ts - lastMini > 200) { lastMini = ts; drawMap($('mini'), false); }
  }
  if (SV.set.q === 3 && G.state === 'play') {
    frameAcc += dt; frameN++;
    if (frameN >= 90) { const avg = frameAcc / frameN; frameAcc = 0; frameN = 0; if (avg > 0.028 && autoW > 232) { autoW = Math.round(autoW * 0.86); setRes(); } else if (avg < 0.019 && autoW < 400) { autoW = Math.round(autoW * 1.08); setRes(); } }
  }
}

/* ---------------- boot ---------------- */
function boot() {
  loadSave(); buildIcons(); setRes();
  window.addEventListener('resize', () => { setRes(); }); window.addEventListener('orientationchange', () => setTimeout(setRes, 300));
  setTimeout(() => {
    try {
      TEX = buildTextures(); SPR = buildMonsterSprites(); ITM = buildItemSprites(); WART = buildWeaponArt();
    } catch (err) { document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;z-index:99;color:#f66;top:0;left:0;background:#000;padding:10px">Init error: ' + err.message + '</pre>'); console.error(err); return; }
    applyTouchMode(); buildMenuScene(); showTitle(); $('loading').classList.add('hidden'); requestAnimationFrame(frame);
  }, 30);
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__nd = { G, P, SV, startLevel, genLevel, playLevel, finishLevel, EN, hurtPlayer, damageEnemy, addEnemy, drawView, calcFlow, showLevels, showResults, showTitle, showRecords };
boot();

</script>
